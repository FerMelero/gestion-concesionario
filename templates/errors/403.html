{% extends "base.html" %}

{% block title %}Sin permiso - 403{% endblock %}

{% block content %}
<div class="container text-center py-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <h1 class="display-1 fw-bold text-secondary">403</h1>
            <i class="bi bi-lock-fill text-warning" style="font-size: 4rem;"></i>
            <h2 class="mt-3">No tienes permiso para esto</h2>
            <p class="lead text-muted">Tu cuenta no tiene acceso a esta página. Si lo necesitas, pídeselo al administrador.</p>
            <hr>
            <a href="{{ url_for('vehiculos.index') }}" class="btn btn-primary btn-lg shadow-sm">
                <i class="bi bi-house-door-fill me-2"></i>Volver al inventario
            </a>
        </div>
    </div>
</div>
{% endblock %}
