{% extends "base.html" %}

{% block title %}Iniciar sesión | Concesionario{% endblock %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-5 col-lg-4">
        <div class="card shadow-sm border-0">
            <div class="card-body p-4">
                <h2 class="h4 mb-4 text-center"><i class="bi bi-car-front-fill me-2 text-primary"></i>Iniciar sesión</h2>
                <form method="POST" action="{{ url_for('auth.login', next=request.args.get('next')) }}">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                    <div class="mb-3">
                        <label class="form-label">Email</label>
                        <input type="email" name="email" class="form-control" value="{{ email }}" autocomplete="username" autofocus required>
                    </div>
                    <div class="mb-4">
                        <label class="form-label">Contraseña</label>
                        <input type="password" name="password" class="form-control" autocomplete="current-password" required>
                    </div>
                    <div class="d-grid">
                        <button type="submit" class="btn btn-primary">Entrar</button>
                    </div>
                </form>
                <p class="small text-muted text-center mt-3 mb-0">Las cuentas las crea el administrador.</p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
