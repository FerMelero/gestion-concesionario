{% extends "base.html" %}

{% block title %}Nuevo Vehículo{% endblock %}

{% block content %}
<div class="card shadow p-4 border-0">
    <h2 class="mb-4 text-primary"><i class="bi bi-car-front-fill me-2"></i>Registrar Nuevo Vehículo</h2>
    <form action="{{ url_for('vehiculos.new_vehicle') }}" method="POST">
        
        <div class="row">
            <div class="col-md-6 mb-3">
                <label class="form-label font-weight-bold">Marca:</label>
                <input type="text" name="marca" class="form-control" placeholder="Ej: Audi" required>
            </div>
            <div class="col-md-6 mb-3">
                <label class="form-label">Modelo:</label>
                <input type="text" name="modelo" class="form-control" placeholder="Ej: A3 Sportback" required>
            </div>
        </div>

        <div class="row">
            <div class="col-md-4 mb-3">
                <label class="form-label">VIN (Número de Bastidor):</label>
                <input type="text" name="vin" class="form-control" maxlength="17" style="text-transform: uppercase;" required>
            </div>
            <div class="col-md-4 mb-3">
                <label class="form-label">Kilómetros:</label>
                <input type="number" step="0.1" name="kilometros" class="form-control" required>
            </div>
            <div class="col-md-4 mb-3">
                <label class="form-label">Año fabricación:</label>
                <input type="date" name="anio" class="form-control" required>
            </div>
        </div>

        <div class="row">
            <div class="col-md-3 mb-3">
                <label class="form-label">Tipo Motor:</label>
                <select name="motor" class="form-select" required>
                    <option value="G">Gasolina (G)</option>
                    <option value="D">Diésel (D)</option>
                    <option value="HB">Híbrido (HB)</option>
                    <option value="E">Eléctrico (E)</option>
                </select>
            </div>
            <div class="col-md-3 mb-3">
                <label class="form-label">Cilindrada (cc):</label>
                <input type="number" name="cilindrada" class="form-control" placeholder="Ej: 1998">
            </div>
            <div class="col-md-3 mb-3">
                <label class="form-label">Potencia (CV):</label>
                <input type="number" name="potencia" class="form-control" required>
            </div>
            <div class="col-md-3 mb-3">
                <label class="form-label">Consumo (L/100km):</label>
                <input type="number" step="0.01" name="consumo" class="form-control" required>
            </div>
        </div>

        <div class="row">
            <div class="col-md-4 mb-3">
                <label class="form-label">Tipo Transmisión:</label>
                <select name="transmision" class="form-select">
                    <option value="Manual">Manual</option>
                    <option value="Automático">Automático</option>
                    <option value="Doble Embrague">Doble Embrague</option>
                    <option value="CVT">CVT</option>
                </select>
            </div>
            <div class="col-md-4 mb-3">
                <label class="form-label">Nº de Marchas:</label>
                <input type="number" name="marchas" class="form-control" placeholder="Ej: 6">
            </div>
            <div class="col-md-4 mb-3">
                <label class="form-label">Estado:</label>
                <select name="estado" class="form-select" required>
                    <option value="D">Disponible</option>
                    <option value="R">Reservado</option>
                    <option value="V">Vendido</option>
                    <option value="T">En Taller</option>
                </select>
            </div>
        </div>

        <div class="row border-top pt-3 mt-2">
            <div class="col-md-4 mb-3">
                <label class="form-label text-danger">Precio Compra (€):</label>
                <input type="number" step="0.01" name="pCompra" class="form-control" required>
            </div>
            <div class="col-md-4 mb-3">
                <label class="form-label text-success">Precio Venta (€):</label>
                <input type="number" step="0.01" name="pVenta" class="form-control" required>
            </div>
            <div class="col-md-4 mb-3">
                <label class="form-label">Fecha de Entrada:</label>
                <input type="date" name="fEntrada" class="form-control" value="{{ today_date }}" required>
            </div>
        </div>

        <div class="d-grid gap-2">
            <button type="submit" class="btn btn-primary btn-lg mt-3">
                <i class="bi bi-save me-2"></i>Registrar Vehículo en Inventario
            </button>
            <a href="{{ url_for('vehiculos.index') }}" class="btn btn-link text-muted">Cancelar y Volver</a>
        </div>
    </form>
</div>
{% endblock %}
